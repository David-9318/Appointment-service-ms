version: '3.8'

services:
  appointments-service:
    build: .
    ports:
      - '4001:4001'
    environment:
      - NODE_ENV=development
      - PORT=4001
      - DB_HOST=appointments-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=appointments_db
    depends_on:
      - appointments-postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  appointments-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appointments_db
    ports:
      - '5432:5432'
    volumes:
      - appointments_postgres_data:/var/lib/postgresql/data

volumes:
  appointments_postgres_data:
